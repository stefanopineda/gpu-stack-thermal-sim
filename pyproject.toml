[project]
name = "gpusim"
version = "0.4.0"
description = "Compact airflow and thermal-network simulator for air-cooled multi-GPU workstations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Stefano Pineda" }]
keywords = ["gpu", "thermal", "airflow", "workstation"]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "pydantic>=2",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
graphviz = ["graphviz"]

[project.scripts]
gpusim = "gpusim.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gpusim*"]

[tool.setuptools.package-data]
gpusim = ["ui/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
