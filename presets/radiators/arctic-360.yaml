notes: Ships with three P12 PWM fans (56.3 CFM, 2.2 mmH2O). Default placement in this
  project is top, exhaust, push — a SPEC rev 3 assumption, flippable. Air-side resistance
  is scaled from a 50 Pa at 0.025 m³/s reference per fan section (gpusim/network.py),
  which is an assumption, then multiplied by thickness/38 and FPI/18.
