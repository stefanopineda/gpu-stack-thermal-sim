_approximate: true
_assumption: Demo steps on Mike Bradley's published build (used with his permission). Only
  the end-card temperatures quoted as "his numbers" are measurements; the rest is the model.
_source: https://x.com/MikeBradleyAI/status/2104206814577295513
id: mike-bradley-demo
title: Mike Bradley's Degen X Station
illustrative_mock: false
base_build: mike-bradley-powerhouse
disclaimer: 'Modelled from Mike Bradley''s public posts. His measured numbers: bottom 49 °C,
  top 79 °C at ~80 % fans; top 69 °C at 100 %.'
steps:
- id: as-built
  title: As built — four Workstation cards touching, 275 W, fans ~80 %
  layout: keep
  fan_duty: 0.8
  advance_s: 20
  talking_points:
  - Four RTX PRO 6000 Workstation cards, no gap between them, capped at 275 W.
  - These cards pull air from underneath and blow it out of the top, so the stack is four
    fans in series. Each card breathes the one below it; the top card sees the hottest air.
  - Model about 47 → 79 °C bottom to top. His posted numbers are 49 → 79 °C.
- id: fans-100
  title: GPU fans at 100 %
  layout: keep
  fan_duty: 1.0
  advance_s: 18
  talking_points:
  - Same stack, fans pinned to 100 %. More air through the column, less rise per card.
  - Model about 45 → 70 °C. He posted 49 → 69 °C.
- id: full-power
  title: Full 600 W per card, fans 100 %
  layout: keep
  fan_duty: 1.0
  power_limit_w: 600
  advance_s: 18
  talking_points:
  - Lift the cap to the full 600 W. The heat per card more than doubles; the column cannot
    carry it, and the upper cards reach the 90 °C cutoff and throttle.
  - This is why he runs the stack at 275 W.
