id: mike-bradley-demo
title: Mike Bradley powerhouse (illustrative mock)
illustrative_mock: true
base_build: mike-bradley-powerhouse
disclaimer: Illustrative mock — not a measurement or claim about anyone's real build.
steps:
- id: as-mocked
  title: 9000D mock, shroud on, Custom Accelerated curve
  layout: keep
  fan_curve: custom_accelerated
  shroud: 'on'
  pressure: standard
  leakage: leaky
  advance_s: 18
  talking_points:
  - Illustrative mock — not a measurement or claim about anyone's real build.
  - 'A 9000D with eight AF120 RGB ELITE front intakes, three RS120 side intakes, a
    top 360 exhaust, an industrial shroud, three gapped Max-Q cards plus one vertical.
    Hottest die about 75 °C.'
  - Same physics as Stefano's case. Only the box and the fans changed.
- id: shroud-off
  title: Same mock, shroud removed
  layout: keep
  fan_curve: custom_accelerated
  shroud: 'off'
  pressure: standard
  leakage: leaky
  advance_s: 16
  talking_points:
  - Pull the shroud off and the bracket outlets see the room again, plus a path back
    into the case. With this much intake the change is small, about 0.3 °C.
- id: packed
  title: Mock cards close-packed
  layout: close4
  fan_curve: custom_accelerated
  shroud: 'on'
  pressure: standard
  leakage: leaky
  advance_s: 16
  talking_points:
  - Eight horizontal slots, four dual-slot cards, no empty slot left.
  - Unthrottled about 85, 91, 91 and 75 °C; the middle two throttle. A strong shroud
    and a 100 % curve do not invent an inlet gap.
