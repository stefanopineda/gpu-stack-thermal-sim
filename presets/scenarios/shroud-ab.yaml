_source: docs/CALIBRATION.md rear shroud mouths
_approximate: true
_assumption: Demo script for the shroud A/B. Temperatures are the nominal model at
  25 °C, stock curve, 300 W, leaky seals, standard fan directions, after the
  2026-09-30 Meshify soak fit (docs/CALIBRATION.md). The taped-crack height was
  not refit. Not fit to Mike Bradley's flow-through stack.
id: shroud-ab
title: Rear shroud A/B — open plenum vs taped stack
illustrative_mock: false
base_build: meshify2xl-stefano
disclaimer: 'Fit to Stefano''s four Meshify soaks on 2026-09-30. Orientation A is the printed shroud on the gapped layout (79 °C). Orientation B stacks the four cards and tapes the shroud down to the GPU exhaust openings (91 °C). A layout that was not one of those soaks is still ±5–10 °C.'
steps:
- id: orientation-a
  title: A — printed shroud, open plenum
  layout: gap1_vertical
  pressure: standard
  shroud: 'on'
  shroud_intake: open
  leakage: leaky
  fan_curve: stock
  advance_s: 24
  talking_points:
  - 'Slots 1/4/7 plus vertical v2, shroud on. Hottest die 79.0 °C. Dies 79.0, 72.9, 79.0, 79.0 °C. Memory 77.8, 71.7, 77.7, 77.8 °C. Exhaust 39.7, 37.4, 39.7, 39.7 °C. Through-GPU about 28, 27, 28, 28 CFM.'
  - 'The two interior gaps bypass about 29 CFM each (58 CFM together) into the plenum at about −20 Pa. The shroud does not pull the top of the top card or the bottom of the bottom card. The vertical card has no mouth of its own; one face is washed by the open-gap stream.'
  - 'That open-gap convection is the 2026-09-30 spaced soak (79 °C with the shroud, 89 °C without). It does not use the fin flow. The taped crack was not refit.'
- id: orientation-b
  title: B — stacked and taped to the GPU mouths
  layout: close4
  pressure: standard
  shroud: 'on'
  shroud_intake: taped
  leakage: leaky
  fan_curve: stock
  advance_s: 26
  talking_points:
  - 'Four cards in slots 1/3/5/7, gaps taped. Hottest die 91.1 °C at full board power. Dies 89.1, 91.1, 91.1, 87.1 °C. Memory 87.9, 89.9, 89.8, 85.9 °C. Exhaust 43.6, 44.5, 44.5, 42.3 °C. The stacked shroud-off soak is 93.1 °C, so the shroud is worth 2 °C here.'
  - 'Through-GPU flow about 28, 27, 27, 30 CFM. Crack flow is about 2 CFM total into a plenum near −47 Pa. The crack coefficient and the 0.6 mm crack height were not refit on 2026-09-30.'
  - 'Stacking, not the tape, is what makes B hotter than A. The open plenum on the spaced layout is 79 °C; this taped stack is 91 °C.'
