notes: '3-pin DC Dynamic X2 GP-12, the 120 mm fan included with the non-RGB Meshify
  2 Compact. Not the PWM SKU (2000 RPM, 87.6 CFM) and not an Aspect 12. Fractal
  publishes only the free-air and dead-head intercepts. The P–Q shape is a quadratic
  stand-in between those intercepts, not a measured curve. 52.3 CFM × 1.699 = 88.9 m³/h.
  rpm_min is 0 because the sheet gives a 4 V startup, not a minimum RPM.'
