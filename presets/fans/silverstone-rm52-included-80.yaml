_assumption: 'The RM52 ships with two 80 mm black fans in the rear fan cage (SilverStone
  product page) and does not name the model or publish a P–Q curve. The manual limits
  those cage fans to 38 mm thick and does not give the included thickness. Intercepts
  are the SST-FN81, a documented SilverStone 80 mm × 25 mm fan: 2050 RPM, 0.72 m³/min,
  1.6 mmH2O, 23 dBA, 1.08 W. The same page also prints 23.53 CFM next to 0.72 m³/min;
  0.72 m³/min is 25.4 CFM, which is the figure used here. Shape is the generic quadratic
  P = Pmax (1-(Q/Qmax)^2). This is not an identification of the included fans as FN81s.'
_source: https://www.silverstonetek.com/en/product/info/fans/FN81/
