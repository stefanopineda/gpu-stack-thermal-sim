notes: '3-pin DC Dynamic X2 GP-14, the 140 mm fan included with the non-RGB Meshify
  2 Compact. Not the PWM SKU (1700 RPM, 105.9 CFM) and not an Aspect 12. Fractal
  publishes only the free-air and dead-head intercepts. The P–Q shape is a quadratic
  stand-in between those intercepts, not a measured curve. 68.4 CFM × 1.699 = 116.2 m³/h.
  rpm_min is 0 because the sheet gives a 4 V startup, not a minimum RPM.'
