notes: Datasheet PDF lists 10.52 mmH2O and the P–Q stations used here (269.3/0, 208.2/2.63,
  139.3/3.98, 65.7/7.67, 0/10.52 mmH2O; the project spec rounds 2.63 to 2.6). The
  current Noctua web spec page (https://www.noctua.at/en/products/nf-a14-industrialppc-3000-pwm/specifications)
  lists 6.58 mmH2O instead. The solver uses the datasheet curve; Monte Carlo draws
  static pressure down to the web-page value. 0.55 A at 12 V is on both the datasheet
  and the web page. Web page also lists 0 RPM at 0% PWM and 850 RPM at 20% PWM; duty
  in this model is a fraction of 3000 RPM.
