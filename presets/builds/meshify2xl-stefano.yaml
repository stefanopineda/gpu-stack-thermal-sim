notes: 'Assumption recorded with the build: the three horizontal cards sit in slots
  1, 4 and 7 (one empty slot between pairs, gap1) and the fourth card is in vertical
  slot v2. Anchor A is this layout with the shroud off. The factorial stock cell is
  stacked (no empty slot), shroud off, standard pressure, leaky — it is not this saved
  build. Front 3× Noctua 140 mm redux-1700 intake, rear 1× redux-1700 exhaust, Arctic
  360 on top as exhaust with its three P12 fans. Bottom mounts are blanked. All PCIe
  slot brackets removed. Rear shroud with 2× NF-A14 industrialPPC-3000 is fitted (shroud
  mode on). GPU fan curve is stock. Rear exhaust fan is an assumption: the case has
  the mount and ''other case mounts'' were described as redux-1700s; only the front
  trio was explicit.'
