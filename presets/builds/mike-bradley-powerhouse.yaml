_source: 'Mike Bradley (@MikeBradleyAI) public posts on X, recorded 2026-09-28:
  https://x.com/MikeBradleyAI/status/2104206814577295513 and replies 2104213812274409748,
  2104370605890097235. Not re-opened in the session that wrote this file (X was not reachable).'
_approximate: true
_assumption: 'Modelled from Mike Bradley''s public build posts, used with his permission
  (per Stefano). Published: Corsair 9000D, 4× RTX PRO 6000 Blackwell Workstation Edition
  close-packed, 275 W cap, unified GPU fans, Noctua 120 mm case fans, air-cooled Threadripper
  PRO 7965WX, SilverStone HELA 2500Rz. Not published, assumed here: the Noctua model and
  count (8 front intake + 4 top exhaust NF-P12 redux-1700, a 140 mm rear exhaust), the CPU
  load (250 W), slots 1/3/5/7, and a 25 °C room.'
