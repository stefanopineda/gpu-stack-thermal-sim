_source: 'Mike Bradley (@MikeBradleyAI) on X, thread of 27–28 Sep 2026, verified 2026-09-28:
  https://x.com/MikeBradleyAI/status/2104206814577295513 (name, 275 W caps, unified GPU fans,
  49/79 °C at ~80 % fans, 49/69 °C at 100 %), /2104213812274409748 (30 °C / 20 °C bottom→top
  deltas), /2104370605890097235 (~47/77 °C), /2104240193746411821 (Corsair 9000D),
  /2104211631840366794 (ASUS WRX90E-SAGE SE, Threadripper PRO 7965WX, 256 GB DDR5),
  /2104245770236891473 (100 % air cooled), /2104231647415513225 (SilverStone HELA 2500Rz),
  /2104220179706307060 (PSU left in the intake airstream), /2090383241823834192 (all
  Noctua fans).'
_approximate: true
_assumption: 'Modelled from Mike Bradley''s public posts, used with his permission (per
  Stefano). Not published, assumed here: the Noctua fan models, count and positions (8 front
  intake + 4 top exhaust NF-P12 redux-1700, 2 rear exhaust stacked above the cards), the CPU cooler (a
  140 mm tower blowing upward with only its top fan fitted, per Stefano: the bottom fan would crowd
  the first GPU) and its load (250 W), card spacing (slots 1/3/5/7, touching — the
  only way four dual-slot cards fit a 7-slot WRX90E), and a 25 °C room. Layout checked by
  Stefano against his build photos: 4×120 top exhaust, 2×120 rear exhaust stacked above the
  cards beside the CPU cooler, no side-wall fans, no rear GPU shroud, no radiator.'
