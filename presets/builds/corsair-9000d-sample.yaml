  https://www.corsair.com/us/en/p/pc-cases/cc-9011273-ww/9000d-rgb-airflow-super-full-tower-pc-case-cc-9011273-ww).
  The template fills the published 8×120 front pattern (4 high × 2 wide) with Corsair
  AF120 RGB ELITE intakes, a 140 mm rear exhaust, and a 360 mm AIO on top as exhaust.'
