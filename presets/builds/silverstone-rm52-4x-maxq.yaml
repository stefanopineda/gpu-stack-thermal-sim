_approximate: true
_assumption: 'Client preset for the SilverStone RM52 stood upright, not a measured
  machine. Fans that ship with the case are fitted; fans the case does not include
  are left off. Rear-fan direction is not printed by SilverStone; both the 140 mm
  I/O fan and the two 80 mm cage fans are treated as exhaust, which is the usual
  rear-of-chassis direction. Front mounts stay empty.'
