notes: 'Stock RM52 airflow: no front fans are included, so the six 120 mm positions
  are empty. The included rear I/O 140 mm and the two rear-cage 80 mm fans are
  fitted as exhaust. Curves are the assumed AP140i and FN81 stand-ins. Four RTX PRO
  6000 Blackwell Max-Q blowers at 300 W, stacked in slots 1/3/5/7 (the case has eight
  slots). No radiator ships with the chassis, so the CPU is air, top fan only so the
  tower clears the top card. Internal radiator bracket is off the drawing (x of the
  inner three mounts is still the bracket station if a fan is added).'
