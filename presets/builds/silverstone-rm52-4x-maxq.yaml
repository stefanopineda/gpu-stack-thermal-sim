notes: 'Chosen front default, not a SilverStone inclusion: six Noctua NF-P12 redux-1700
  PWM intakes (70.75 CFM, 2.83 mmH2O, published P–Q from the Noctua specification
  PDF). Three sit on the front bracket and three on the internal bracket. The case
  itself ships those mounts empty. The included rear I/O 140 mm and the two rear-cage
  80 mm fans stay exhaust; their curves are the assumed AP140i and FN81 stand-ins.
  Four RTX PRO 6000 Blackwell Max-Q blowers at 300 W, stacked in slots 1/3/5/7.
  No radiator ships with the chassis, so the CPU is air, top fan only so the tower
  clears the top card.'
