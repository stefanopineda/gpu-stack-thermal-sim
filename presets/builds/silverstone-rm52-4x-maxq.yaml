_approximate: true
_assumption: 'Client preset for the SilverStone RM52 stood upright, not a measured
  machine. The case ships with no front fans. The six 120 mm mounts are filled with
  a chosen default, the Noctua NF-P12 redux-1700 PWM, as intake. That fan is not
  included by SilverStone. Rear-fan direction is not printed; the included 140 mm
  I/O fan and the two 80 mm cage fans stay exhaust.'
