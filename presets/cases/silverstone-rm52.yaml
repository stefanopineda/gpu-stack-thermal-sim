dimension_note: 'SST-RM52, 5U rackmount (not 4U). Product page and product sheet:
  incl. rear fan cage 440 mm (W) × 220 mm (H) × 605 mm (D), 58.56 L; excl. cage
  440 × 220 × 560 mm, 54.21 L. Eight PCI slots. GPU length 512 mm with no front fans
  or radiators and the internal radiator bracket removed, or 365 mm with dual radiators
  at 53 mm combined thickness each. Card width 160 mm with the retainer, 198 mm without
  (manual also draws 165 mm and 186 mm with the clamps). CPU cooler 181 mm with the
  retainer, 192 mm without. Cooling system: front 120 mm × 6; rear I/O 120 mm × 1 or
  140 mm × 1 with one 140 mm fan included; rear fan cage 80 mm × 2 with two 80 mm fans
  included. Radiators: front 120 mm × 4 / 360 mm × 2, rear 120 mm × 1. Manual radiator
  length limit 407 mm. No top, bottom, or side fan mounts are listed. Steel. Motherboards
  through SSI-EEB. Upright or horizontal placement; this preset is the upright frame.'
notes: 'Included fans are only the rear 140 mm and the two rear-cage 80 mm fans.
  Front 120 mm positions ship empty. Fan model numbers are not on the product page
  or the manual; the curves are labelled assumed stand-ins.'
