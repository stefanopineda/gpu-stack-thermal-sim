top_slot_y_mm:
  value: 287.44
  approximate: true
  assumption: 'Slot 1 height in this case. An ATX board is 12.000 in (304.8 mm)
    along the connector edge and 9.600 in (243.84 mm) deep (ATX Specification 2.2
    §3.1). The view places the top edge of that board 25 mm under the case top.
    Seven slot centers sit on a 20.32 mm pitch with the lowest center one pitch
    above the bottom edge of the board, which is the cut that leaves microATX
    (9.6 in along the connector edge, four slots) sharing the same top slot.
    450 - (304.8 - 7×20.32) = 287.44 mm. Figure 3 of the spec is a drawing and
    does not publish a machine-readable pin-1 coordinate. This is that stack,
    not a measured Meshify hole position.'
