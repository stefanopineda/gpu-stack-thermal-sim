dimension_note: 'Standard (non-RGB) Meshify 2 Compact. Exterior follows the Meshify
  2 XL convention: Fractal''s headline "Case dimensions (LxWxH)", which includes
  feet, not the without-feet line. The sheet lists 424 × 210 × 475 mm with feet
  and 412 × 210 × 455 mm without feet, protrusions and screws. Stored as depth ×
  width × height, so 424 × 210 × 475. Seven bridgeless slots. Motherboards ATX /
  mATX / Mini-ITX. GPU length 341 mm with the front fans installed, 360 mm without
  them. CPU cooler 169 mm. Stock fans are only 2× Dynamic X2 GP-14 front intake
  and 1× Dynamic X2 GP-12 rear exhaust. Front also takes 3×120. Top takes 2×120
  or 2×140 and ships empty. Bottom takes 1×120 only with the HDD cage removed.
  The RGB SKU''s four Aspect 12 fans are a different case and are not used here.
  Dust filters on top, front and bottom. Mesh front. Tempered glass or steel side;
  the preset uses glass. PSU shroud is full length.'
notes: 'Non-RGB Meshify 2 Compact. Stock fan map is the two front 140 mm intakes
  and the rear 120 mm exhaust. Top and bottom ship empty.'
