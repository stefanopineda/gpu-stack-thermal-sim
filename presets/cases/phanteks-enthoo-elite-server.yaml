dimension_note: phanteks.com lists '582 x 261 x 721 mm' with no axis labels (22.91
  x 10.27 x 28.38 in). Interpreted as H × W × D because 261 mm cannot be the height
  of a 12-slot chassis. Model PH-ES916E_BK02. 12 PCI slots. Vertical GPU is a separate
  riser bracket, not extra rear slots, so vertical_slots is 0. The original Enthoo
  Elite (different chassis) is 10 slots; Enthoo Pro 2 Server V2 is 11. This preset
  is the 12-slot Enthoo Elite Server, as Stefano confirmed. The mount list is the
  140 mm pattern (front 4, top 3, rear 1, bottom 3, side 2, midplate 3). Phanteks
  lists rear 2×140; only one fits above the 12-slot bracket area in this schematic,
  so rev 4 models one. The extra 120 mm-only left-side brackets are omitted.
notes: Dual PSU support is real and not modelled as a second heat source.
