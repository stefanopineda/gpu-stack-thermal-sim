dimension_note: 'Corsair lists height 698 mm, length 698 mm, width 307 mm. Expansion:
  ''8 Horizontal (or 4 Vertical) + 2 Vertical (For Secondary Motherboard)''. Modelled
  here as 8 horizontal + 2 vertical. Front/top 140 mm and 120 mm patterns are alternate
  InfiniRail layouts. Rev 4 models the front as the 8×120 pattern, 4 high × 2 wide
  (Corsair: "dual 480mm radiators side-by-side"), and the rear as 1×140 (Corsair:
  rear 2×120 or 1×140), and the top as one row of 4×120 (Corsair: top 8×120). Bottom has no fan or radiator support. PSU max length 225
  mm. Corsair lists "Included Fans: No Fans Included"; the 9000D template populates
  the front array with AF120 RGB ELITE as an assumption. The two extra vertical slots
  are, per Corsair, for a secondary motherboard; the model uses them as vertical GPU
  positions for convenience.'
notes: Real case. The Mike Bradley build that uses it is a separate illustrative mock.
