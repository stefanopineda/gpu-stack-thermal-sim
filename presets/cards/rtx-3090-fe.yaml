notes: 'NVIDIA: 350 W, 313 × 138 mm, 3-slot, max GPU temperature 93 °C. Cooler: "The
  left fan pushes air onto the baseplate and exhausts out the PCI-E slot (just like
  a blower style cooler). The right fan pulls air through the finstack ... exhausted
  right out the other side of the card" (https://www.tomshardware.com/news/a-closer-look-at-the-geforce-rtx-3080-rtx-3090-founders-edition-coolers).
  Tom''s Hardware review (https://www.tomshardware.com/reviews/nvidia-geforce-rtx-3090-review/6):
  tops out at 65 °C, fans ~1100 RPM, ~360 W. Legit Reviews open bench (https://www.legitreviews.com/nvidia-geforce-rtx-3090-founders-edition-review_222243/14):
  ~67 °C, ~1175 RPM. Open-air target here is about 68 °C at 25 °C ambient.'
