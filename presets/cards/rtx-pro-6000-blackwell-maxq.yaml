notes: 'Form factor on the NVIDIA datasheet: 4.4 in × 10.5 in, dual slot, full height,
  300 W total board power. ELSA''s board drawing gives 266.7 × 111.15 × 37 mm excluding
  the bracket. 96 GB GDDR7, 24,064 CUDA cores, PCIe 5.0 x16. NVIDIA''s datasheet says
  thermal solution ''Active'' and does not publish a P–Q curve. The blower description
  (enclosed shroud, rear-bracket exhaust) is from board-partner and retailer writeups
  such as https://www.centralcomputer.com/blog/post/understanding-the-nvidia-rtx-6000-pro-blackwell-lineup-workstation-max-q-and-server-editions.
  Blower free air, dead-head pressure, fin geometry and TIM live in gpusim/calib.py
  and are joint-fit to open air plus anchors A and B.'
