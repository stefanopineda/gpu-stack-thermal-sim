notes: Template only. Labelled as such in the UI. NVIDIA's datasheet says thermal
  solution 'Active' and does not publish a P–Q curve. The blower description (enclosed
  shroud, rear-bracket exhaust) is from board-partner and retailer writeups such as
  https://www.centralcomputer.com/blog/post/understanding-the-nvidia-rtx-6000-pro-blackwell-lineup-workstation-max-q-and-server-editions.
  Blower free air, dead-head pressure, fin geometry and TIM live in gpusim/calib.py
  and are joint-fit to open air plus anchors A and B.
