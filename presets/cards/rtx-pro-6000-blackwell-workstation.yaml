notes: 'Datasheet: total board power 600 W; 5.4" H × 12" L, dual slot, extended height;
  thermal solution "Double-flow-through". Two axial fans in a housing nearly identical
  to the RTX 5090 FE (https://www.pugetsystems.com/labs/articles/nvidia-rtx-pro-6000-blackwell-workstation-content-creation-review/).
  AEC Magazine: it "draws air in from beneath the card and vents it out of the top
  ... hot air from one card can be pulled straight into the next"
  (https://aecmag.com/workstations/review-nvidia-rtx-pro-blackwell-series-gpus/).
  No published sustained-load die temperature was found. The open-air target is
  the 5090 FE review figure plus the extra 25 W, and is approximate. Fan intercepts,
  fin geometry and TIM are in gpusim/calib.py.'
