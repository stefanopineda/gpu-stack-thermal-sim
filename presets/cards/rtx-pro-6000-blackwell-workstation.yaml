throttle_c:
  value: 88
  approximate: true
  assumption: NVIDIA does not print a slowdown temperature on the datasheet. Uses the
    GeForce Blackwell figure (RTX 5090 max GPU temperature 90 °C) as the cutoff and
    flags 2 °C below it.
cutoff_c:
  value: 90
  approximate: true
  assumption: Same shell and cooler as the RTX 5090 Founders Edition (Puget Systems
    review); NVIDIA lists 90 °C max GPU temperature for the 5090.
fan_curves:
  _approximate: true
  _assumption: 'NVIDIA does not publish the fan table. stock is shared with the RTX
    5090 FE: about 52 % of an assumed 3000 RPM maximum near 75 °C, which is the
    ~1570 RPM Gamers Nexus measured on the 5090 FE at steady state. A user report
    (https://www.ovidiudan.com/2026/01/17/nvidia-rtx-pro-6000-blackwell-fan-control.html)
    says the stock curve is slow to ramp under sustained load. custom_accelerated
    is global (gpusim/calib.py).'
